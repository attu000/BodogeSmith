

{% block content %}
  <h2>{% if 'create' in request.path %}部屋の作成{% else %}部屋に参加{% endif %}</h2>

  {% if messages %}
    <ul class="messages">
      {% for message in messages %}
        <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">送信</button>
  </form>
{% endblock %}
